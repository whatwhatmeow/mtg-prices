name: Weekly card prices

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays, 3 am Central
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build price and card files from Scryfall
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, datetime
          UA = {"User-Agent": "mtg-prices-weekly/1.0", "Accept": "application/json"}
          def get(url):
              return urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=600)
          src = os.environ.get("BULK_FILE")
          if not src:
              listing = json.load(get("https://api.scryfall.com/bulk-data"))
              files = listing.get("data", []) if isinstance(listing, dict) else []
              uri = next((b.get("download_uri") for b in files if b.get("type") == "default_cards"), None)
              if not uri:
                  print("Scryfall did not list a default_cards file. It answered:")
                  print(json.dumps(listing)[:3000])
                  raise SystemExit(1)
              print("Downloading", uri)
              src = "bulk.json"
              with get(uri) as r, open(src, "wb") as f:
                  while chunk := r.read(1 << 20):
                      f.write(chunk)
              print("Downloaded", os.path.getsize(src) // 1_000_000, "MB")
          cards = json.load(open(src, encoding="utf-8"))
          SKIP = {"token", "double_faced_token", "emblem", "art_series", "vanguard", "scheme", "planar"}
          prices, info, alias = {}, {}, {}
          for c in cards:
              if "paper" not in c.get("games", []) or c.get("layout") in SKIP:
                  continue
              name = c["name"]
              faces = c.get("card_faces") or []
              if name not in info:
                  info[name] = {
                      "t": c.get("type_line") or " // ".join(f.get("type_line", "") for f in faces),
                      "mc": c.get("mana_cost") or " // ".join(f.get("mana_cost", "") for f in faces),
                      "cmc": c.get("cmc", 0),
                      "o": c.get("oracle_text") or "\n//\n".join(f.get("oracle_text", "") for f in faces),
                      "ci": "".join(c.get("color_identity", [])),
                      "gc": bool(c.get("game_changer")),
                      "cmdr": c.get("legalities", {}).get("commander", ""),
                  }
                  if " // " in name:
                      alias[name.split(" // ")[0]] = name
              p = c.get("prices", {})
              vals = [float(p[k]) for k in ("usd", "usd_foil", "usd_etched") if p.get(k)]
              if not vals:
                  continue
              usd = float(p["usd"]) if p.get("usd") else min(vals)
              if name not in prices or usd < prices[name][0]:
                  prices[name] = [round(usd, 2), c.get("set", "").upper()]
          today = datetime.date.today().isoformat()
          os.makedirs("data", exist_ok=True)
          json.dump({"updated": today, "source": "Scryfall (TCGplayer market, cheapest paper printing)", "cards": prices},
                    open("data/prices.json", "w"), separators=(",", ":"))
          json.dump({"updated": today, "cards": info, "aliases": alias}, open("data/cards.json", "w"), separators=(",", ":"))
          print(len(prices), "prices,", len(info), "cards")
          PY
      - name: Save the files to the repo
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add data
          git commit -m "Card prices $(date -u +%F)" || echo "No changes this week"
          git push
